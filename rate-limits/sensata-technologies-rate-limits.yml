specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Sensata Technologies
providerId: sensata-technologies
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Sensors
  - Industrial
  - IoT
  - Rate Limiting
description: Sensata Technologies does not publish public API rate limits. Any customer-facing platforms
  (Sensata IQ, Xirgo telematics, etc.) expose limits only to provisioned tenants under contract.
sources:
  - https://www.sensata.com/
notes: No public rate-limit documentation was reconcilable. Limits are tenant-specific and disclosed
  to customers under their commercial agreement.
responseCodes:
  throttled: 429
limits:
  - name: Tenant fair-use throttling
    scope: tenant
    metric: varies
    limit: see customer agreement
    notes: Disclosed only to provisioned customers; no public threshold.
policies:
  - name: Backoff
    description: Standard practice — on 429 / 503 responses, back off and retry with exponential delay.
  - name: Disclosure
    description: Specific request-rate limits are disclosed to customers via Sensata account management
      or platform-specific documentation, not public web pages.
maintainers:
